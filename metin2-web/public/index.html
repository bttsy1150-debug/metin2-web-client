<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Metin2 Web Client - Kesin Çözüm</title>
    <style>
        body { margin: 0; background-color: #111; color: white; font-family: sans-serif; overflow: hidden; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #canvas-container { position: relative; width: 600px; height: 450px; border: 4px solid #555; border-radius: 8px; box-shadow: 0 0 25px rgba(0,0,0,0.7); }
        canvas { background-color: #3d5427; display: block; }
        #stats-ui { position: absolute; bottom: 15px; left: 15px; background: rgba(0,0,0,0.85); padding: 12px; border-radius: 6px; border: 2px solid #666; width: 240px; z-index: 200; font-size: 13px; text-shadow: 1px 1px 1px #000; }
        .ui-bar { width: 100%; background: #444; border: 1px solid #000; padding:1px; margin-bottom:6px; border-radius:2px; overflow:hidden; }
        .hp-fill { background: #ff0000; height: 14px; text-align:center; font-size:10px; line-height:14px; font-weight:bold; color:white; }
        .exp-fill { background: #00ffcc; height: 14px; text-align:center; font-size:10px; line-height:14px; font-weight:bold; color:black; }
    </style>
</head>
<body>
    <div id="canvas-container">
        <!-- Oyun buraya pürüzsüzce çizilecek, kilitlenme şansı sıfır -->
        <canvas id="gameCanvas" width="600" height="450"></canvas>
        <div id="stats-ui">Metin2 Yükleniyor...</div>
    </div>

    <script>
        var canvas = document.getElementById("gameCanvas");
        var ctx = canvas.getContext("2d");

        // --- OYUNCU AYARLARI ---
        var pStats = { level: 3, hp: 940, maxHp: 1000, exp: 40, maxExp: 100, yang: 5000, weaponUpgrade: 0 };
        var pPos = { x: 270, y: 220 };
        var activeKeys = { w: false, a: false, s: false, d: false };

        // --- CANAVARLAR VE DEMİRCİ ---
        var smithPos = { x: 500, y: 80 };
        var mobList = [
            { id: 1, name: "Yabani Köpek", x: 80, y: 80, hp: 90, isDead: false, isAggressive: false },
            { id: 2, name: "Yabani Köpek", x: 450, y: 140, hp: 90, isDead: false, isAggressive: false }, 
            { id: 3, name: "Aç Yabani Köpek", x: 120, y: 350, hp: 120, isDead: false, isAggressive: false },
            { id: 4, name: "Kurt", x: 480, y: 320, hp: 150, isDead: false, isAggressive: false },
            { id: 5, name: "Aç Kurt", x: 300, y: 90, hp: 150, isDead: false, isAggressive: false }
        ];

        var damageTexts = [];
        var smithTexts = [];

        function drawInterface() {
            var ui = document.getElementById('stats-ui');
            if (!ui) return;
            var currentDamage = 30 + (pStats.weaponUpgrade * 10);
            var cost = (pStats.weaponUpgrade + 1) * 800;
            var smithPrompt = "";
            
            var dX = Math.abs(pPos.x - smithPos.x);
            var dY = Math.abs(pPos.y - smithPos.y);
            if (dX < 50 && dY < 50) {
                if (pStats.weaponUpgrade >= 9) {
                    smithPrompt = '<div style="color:#00ff00; font-size:11px; margin-top:4px; text-align:center;"><b>[Silah Maksimum!]</b></div>';
                } else {
                    smithPrompt = '<div style="color:#ffdd00; font-size:11px; margin-top:4px; text-align:center;"><b>Demirciye Yakınsın!</b><br>Kılıcı Yükseltmek İçin <b>"E"</b> bas.<br>Maliyet: <b>' + cost + ' Yang</b></div>';
                }
            }

            var expPct = (pStats.exp / pStats.maxExp) * 100;
            ui.innerHTML = '<div style="font-size:14px; font-weight:bold; color:#ffdd00; margin-bottom:2px; text-align:center;">Metin2 Web [Lv. ' + pStats.level + ']</div>' +
                '<div style="font-size:12px; color:#aaa; font-weight:bold; text-align:center; margin-bottom:4px;">Geniş Kılıç +' + pStats.weaponUpgrade + ' (Hasar: ' + currentDamage + ')</div>' +
                '<div style="font-size:12px; font-weight:bold; color:#ffcc00; margin-bottom:6px; text-align:center;">Yang: ' + pStats.yang.toLocaleString('tr-TR') + '</div>' +
                '<div class="ui-bar"><div class="hp-fill" style="width: ' + ((pStats.hp / pStats.maxHp) * 100) + '%;">HP: ' + pStats.hp + '/' + pStats.maxHp + '</div></div>' +
                '<div class="ui-bar"><div class="exp-fill" style="width: ' + expPct + '%;">EXP: %' + expPct.toFixed(0) + '</div></div>' +
                '<div style="font-size:11px; color:#ccc; text-align:center; margin-top:4px; line-height:13px;"><b>WASD:</b> Yürü | <b>Space:</b> Saldır</div>' +
                smithPrompt;
        }

        window.addEventListener('keydown', function(e) {
            var key = e.key.toLowerCase();
            if (activeKeys[key] !== undefined) activeKeys[key] = true;

            if (key === 'e') {
                if (Math.abs(pPos.x - smithPos.x) < 50 && Math.abs(pPos.y - smithPos.y) < 50) {
                    if (pStats.weaponUpgrade >= 9) return;
                    var cost = (pStats.weaponUpgrade + 1) * 800;
                    if (pStats.yang >= cost) {
                        pStats.yang -= cost; pStats.weaponUpgrade++;
                        smithTexts.push({ x: smithPos.x, y: smithPos.y - 20, text: "Başarılı! +" + pStats.weaponUpgrade, color: "#00ff00", timer: 40 });
                    } else {
                        smithTexts.push({ x: smithPos.x, y: smithPos.y - 20, text: "Yetersiz Yang!", color: "#ff3333", timer: 40 });
                    }
                    drawInterface();
                }
            }

            if (e.key === ' ' || e.code === 'Space') {
                var dmg = 30 + (pStats.weaponUpgrade * 10);
                mobList.forEach(function(mob) {
                    if (mob.isDead) return;
                    if (Math.abs(pPos.x - mob.x) < 50 && Math.abs(pPos.y - mob.y) < 50) {
                        mob.hp -= dmg; mob.isAggressive = true;
                        damageTexts.push({ x: mob.x, y: mob.y - 15, text: "-" + dmg, timer: 30 });
                        if (mob.hp <= 0) {
                            mob.isDead = true; pStats.exp += 35; pStats.yang += Math.floor(Math.random() * 300) + 150;
                            if (pStats.exp >= pStats.maxExp) { pStats.level++; pStats.exp = 0; pStats.maxHp += 100; pStats.hp = pStats.maxHp; }
                            setTimeout(function() {
                                mob.isDead = false; mob.isAggressive = false; mob.hp = mob.name.includes("Kurt") ? 150 : 90;
                                mob.x = Math.floor(Math.random() * 500) + 50; mob.y = Math.floor(Math.random() * 350) + 50;
                            }, 5000);
                        }
                    }
                });
                drawInterface();
            }
        });

        window.addEventListener('keyup', function(e) {
            var key = e.key.toLowerCase();
            if (activeKeys[key] !== undefined) activeKeys[key] = false;
        });

        function gameLoop() {
            // 1. OYUNCU HAREKETİ
            var step = 4;
            var prevX = pPos.x, prevY = pPos.y;
            if (activeKeys.w && pPos.y > 20) pPos.y -= step;
            if (activeKeys.s && pPos.y < 430) pPos.y += step;
            if (activeKeys.a && pPos.x > 20) pPos.x -= step;
            if (activeKeys.d && pPos.x < 580) pPos.x += step;

            if (Math.abs(pPos.x - smithPos.x) < 35 && Math.abs(pPos.y - smithPos.y) < 35) { pPos.x = prevX; pPos.y = prevY; }

            // 2. YAPAY ZEKA
            mobList.forEach(function(mob) {
                if (mob.isDead || !mob.isAggressive) return;
                var dX = pPos.x - mob.x, dY = pPos.y - mob.y;
                if (Math.abs(dX) < 200 && Math.abs(dY) < 200) {
                    if (mob.x < pPos.x) mob.x += 1.2; else mob.x -= 1.2;
                    if (mob.y < pPos.y) mob.y += 1.2; else mob.y -= 1.2;
                    if (Math.abs(dX) < 20 && Math.abs(dY) < 20 && Math.random() < 0.02) {
                        pStats.hp -= 8;
                        if (pStats.hp <= 0) { pStats.hp = pStats.maxHp; pPos = { x: 270, y: 220 }; mobList.forEach(function(m) { m.isAggressive = false; }); }
                        drawInterface();
                    }
                }
            });

            // 3. EKRANA ÇİZİM (CANVAS)
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Çimen Görünümü
            ctx.fillStyle = "#3d5427"; ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Demirci Çizimi (Geniş İzometrik Gri Kutu)
            ctx.fillStyle = "#555555"; ctx.fillRect(smithPos.x - 15, smithPos.y - 20, 30, 40);
            ctx.fillStyle = "#ffcc00"; ctx.font = "bold 11px Tahoma"; ctx.fillText("[Demirci]", smithPos.x - 22, smithPos.y - 25);

            // Canavarlar Çizimi
            mobList.forEach(function(mob) {
                if (mob.isDead) return;
                ctx.fillStyle = "#8b0000"; ctx.fillRect(mob.x - 12, mob.y - 12, 24, 24);
                ctx.fillStyle = "#ff5555"; ctx.font = "bold 11px Tahoma"; ctx.fillText("[" + mob.name + "]", mob.x - 30, mob.y - 18);
            });

            // Oyuncu Çizimi (Mavi Savaşçı Kutusu)
            ctx.fillStyle = "#0000ff"; ctx.fillRect(pPos.x - 12, pPos.y - 15, 24, 30);
            ctx.fillStyle = "#88ccff"; ctx.font = "bold 11px Tahoma"; ctx.fillText("[Savaşçı]", pPos.x - 22, pPos.y - 22);

            // Uçan Yazıların Güncellenmesi
            damageTexts.forEach(function(t, i) { t.y -= 1; ctx.fillStyle = "#ff3333"; ctx.font = "bold 16px Arial"; ctx.fillText(t.text, t.x - 10, t.y); t.timer--; if (t.timer <= 0) damageTexts.splice(i, 1); });
            smithTexts.forEach(function(t, i) { t.y -= 0.5; ctx.fillStyle = t.color; ctx.font = "bold 13px Tahoma"; ctx.fillText(t.text, t.x - 30, t.y); t.timer--; if (t.timer <= 0) smithTexts.splice(i, 1); });

            requestAnimationFrame(gameLoop);
        }

        window.onload = function() { drawInterface(); gameLoop(); };
    </script>
</body>
