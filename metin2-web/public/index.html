<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Metin2 Web Client</title>
    <style>
        body { margin: 0; background-color: #111; color: white; font-family: sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
        
        /* Harita Kapsayıcısı */
        #game-container { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 600px; height: 450px; background-color: #2c421e; border: 4px solid #444; border-radius: 8px; box-shadow: 0 0 30px rgba(0,0,0,0.8); overflow: hidden;
        }
        
        /* Genel Element Yapısı */
        .render-object { 
            position: absolute; 
            transform: translate(-50%, -50%); 
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            width: 50px; height: 50px;
            display: block !important;
        }

        /* Karakter İsim Etiketleri */
        .name-tag {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            font-weight: bold;
            font-family: 'Tahoma', sans-serif;
            text-shadow: 1px 1px 2px #000;
            white-space: nowrap;
            padding: 1px 4px;
            border-radius: 2px;
            pointer-events: none;
            z-index: 999;
        }
        
        /* OYUNCU SAVAŞÇI */
        #hero-player { 
            z-index: 10; 
            background-image: url('image_v24_-c.png'); 
            background-color: #0000ff; /* Resim gelmezse mavi kutu olur, kilitlenmez */
            border: 2px solid #fff;
            border-radius: 4px;
        }
        #hero-player .name-tag { color: #88ccff; }
        
        /* CANAVARLAR */
        .enemy-monster { z-index: 5; background-color: #8b0000; border: 2px solid #ff0000; border-radius: 4px; }
        .enemy-monster .name-tag { color: #ff5555; }
        
        /* Canavar Görselleri (Resim yoksa arka plan rengi kalır) */
        .mob-yabani-kopek { background-image: url('image_Wc8LTA.png'); }
        .mob-ac-yabani-kopek { background-image: url('image_B2Bglw.png'); }
        .mob-kurt { background-image: url('image_eMPP7C.png'); }
        .mob-ac-kurt { background-image: url('image_-RgfPm.png'); }
        
        /* DEMİRCİ */
        .npc-blacksmith { 
            z-index: 8;
            background-image: url('image_JRqo63.png');
            background-color: #555555;
            border: 2px solid #aaa;
            border-radius: 4px;
        }
        .npc-blacksmith .name-tag { color: #ffcc00; }

        /* Arayüz Paneli */
        #stats-ui { position: absolute; bottom: 15px; left: 15px; background: rgba(0,0,0,0.85); padding: 12px; border-radius: 6px; border: 2px solid #555; width: 240px; z-index: 200; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .ui-bar { width: 100%; background: #444; border: 1px solid #000; padding:1px; margin-bottom:6px; border-radius:2px; overflow:hidden; }
        .hp-fill { background: #ff0000; height: 14px; text-align:center; font-size:10px; line-height:14px; font-weight:bold; color:white; transition: width 0.1s; }
        .exp-fill { background: #00ffcc; height: 14px; text-align:center; font-size:10px; line-height:14px; font-weight:bold; color:black; transition: width 0.1s; }

        /* Efektler */
        .damage-indicator { position: absolute; color: #ff3333; font-family: 'Arial Black', sans-serif; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 0px #000; z-index: 100; pointer-events: none; animation: floatUpAndFade 0.6s ease-out forwards; }
        .blacksmith-text { position: absolute; font-family: 'Tahoma', sans-serif; font-size: 14px; font-weight: bold; text-shadow: 1px 1px 2px #000; z-index: 110; pointer-events: none; animation: floatUpAndFade 0.8s ease-out forwards; }
        .yang-drop { position: absolute; background-color: #ffcc00; color: #332200; font-family: 'Tahoma', sans-serif; font-size: 11px; font-weight: bold; padding: 2px 6px; border: 1px solid #cca100; border-radius: 10px; box-shadow: 0 0 10px #ffcc00, inset 0 0 4px #ffffff; z-index: 4; transform: translate(-50%, -50%); pointer-events: none; }
        
        @keyframes floatUpAndFade { 0% { transform: translate(-50%, -50%) translateY(0); opacity: 1; } 100% { transform: translate(-50%, -50%) translateY(-45px); opacity: 0; } }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Oyuncu Karakteri -->
        <div id="hero-player" class="render-object">
            <div class="name-tag">[Savaşçı]</div>
        </div>
        
        <!-- Demirci NPC'si -->
        <div id="npc-smith" class="render-object npc-blacksmith" style="left: 500px; top: 80px;">
            <div class="name-tag">[Demirci]</div>
        </div>
    </div>
    <div id="stats-ui">Metin2 Yükleniyor...</div>

    <!-- Güvenli ve Bağımsız Script Yükleyici -->
    <script src="main.js"></script>
</body>
</html>
