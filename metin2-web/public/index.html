<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Metin2 Tarayıcı Sürümü</title>
    <style>
        body { margin: 0; background-color: #222; color: white; font-family: sans-serif; overflow: hidden; }
        #game-map { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 500px; height: 400px; background-color: #3d5427; 
            border: 3px solid #555; position: relative; border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .entity { position: absolute; padding: 5px 10px; font-weight: bold; border-radius: 4px; font-size: 12px; text-shadow: 1px 1px 1px #000; transition: all 0.05s linear; }
        #player { background-color: #0000ff; border: 2px solid #fff; z-index: 10; }
        .monster { background-color: #8b0000; border: 2px solid #ff0000; }
        #ui-overlay { 
            position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.85); 
            padding: 15px; border-radius: 8px; border: 2px solid #555; width: 260px;
        }
    </style>
</head>
<body>
    <!-- Gerçek görsel harita alanı -->
    <div id="game-map">
        [Savaşçı]</div>
    </div>

    <div id="ui-overlay">Yükleniyor...</div>
    <script src="main.js"></script>
</body>
</html>
