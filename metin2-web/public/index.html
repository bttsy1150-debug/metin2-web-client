<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Metin2 Web 3D Client</title>
    <style>
        body { margin: 0; background-color: #050505; color: white; font-family: sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
        
        /* 3D WebGL Sahnesi Ekranı Kaplayacak */
        #threejs-canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Sol Alttaki HP / EXP / YANG Arayüz Paneli */
        #stats-ui { 
            position: absolute; 
            bottom: 20px; 
            left: 20px; 
            background: rgba(0,0,0,0.85); 
            padding: 14px; 
            border-radius: 8px; 
            border: 2px solid #555; 
            width: 250px; 
            z-index: 200; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            pointer-events: auto;
        }
        
        .ui-bar { width: 100%; background: #333; border: 1px solid #000; padding:1px; margin-bottom:6px; border-radius:2px; overflow:hidden; }
        .hp-fill { background: #ff0000; height: 14px; text-align:center; font-size:10px; line-height:14px; font-weight:bold; color:white; transition: width 0.1s; }
        .exp-fill { background: #00ffcc; height: 14px; text-align:center; font-size:10px; line-height:14px; font-weight:bold; color:black; transition: width 0.1s; }
    </style>
    
    <!-- Kararlı ve Güvenilir Resmi Three.js Kütüphanesi -->
    <script src="https://cloudflare.com"></script>
</head>
<body>
    <!-- 3D Dünyanın Çizileceği Alan -->
    <div id="threejs-canvas-container"></div>
    
    <!-- Metin2 UI Paneli -->
    <div id="stats-ui">Metin2 3D Dünyası Yükleniyor...</div>

    <!-- Önbellek Kilitlenmesini Önleyen Dinamik Script Bağlayıcı -->
    <script>
        var script = document.createElement('script');
        script.src = 'main.js?t=' + new Date().getTime();
        document.body.appendChild(script);
    </script>
</body>
</html>
